{% extends "base.html" %}{% block title %}スレッド作成{% endblock %}
{% block content %}<a class="back-link" href="/">← スレッド一覧に戻る</a><div class="page-heading"><span class="eyebrow">START A CONVERSATION</span><h1>新しい話題を立てる</h1><p>気になったニュースや時事問題を自由に投稿できます。</p></div>
<form action="/topics" method="post" class="form-card"><input type="hidden" name="_csrf" value="{{csrf}}"><label for="category">カテゴリー</label><select id="category" name="category" required><option value="">カテゴリーを選択</option>{% for category in categories %}<option value="{{category}}">{{category}}</option>{% endfor %}</select><label for="title">スレッドタイトル <small>3〜120文字</small></label><input type="text" id="title" name="title" minlength="3" maxlength="120" required placeholder="何について話したい？"><label for="body">本文 <small>5〜5000文字</small></label><textarea id="body" name="body" rows="9" minlength="5" maxlength="5000" required placeholder="ニュースへのリンクや、あなたの考えを書いてください。"></textarea><p class="form-note">匿名で公開されます。個人情報・脅迫・中傷・スパムの投稿は避けてください。</p><button class="btn btn-dark" type="submit">スレッドを公開する →</button></form>{% endblock %}
