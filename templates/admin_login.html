{% extends "base.html" %}{% block title %}管理者ログイン{% endblock %}{% block content %}<div class="page-heading"><h1>管理者ログイン</h1></div>{% if enabled %}<form class="form-card" action="/admin/login" method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label for="password">管理者パスワード</label><input type="password" id="password" name="password" required autocomplete="current-password"><button type="submit" class="btn btn-dark">ログイン</button></form>{% else %}<div class="empty">管理者パスワードが未設定のため、管理機能は無効です。環境変数 ADMIN_PASSWORD を設定してください。</div>{% endif %}{% endblock %}
